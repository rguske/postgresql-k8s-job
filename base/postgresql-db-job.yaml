apiVersion: batch/v1
kind: Job
metadata:
  name: init-vmdb
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init-vmdb
          image: registry.redhat.io/rhel9/postgresql-16
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: postgresql-job-secret
                  key: DB_HOST
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgresql-job-secret
                  key: DB_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-job-secret
                  key: POSTGRES_PASSWORD
          command:
            - /bin/bash
            - -c
            - |
              set -e
              echo "Checking database vmdb..."
              if psql -h "${DB_HOST}" -U "${DB_USER}" -d postgres -t -A -c "SELECT 1 FROM pg_database WHERE datname='vmdb'" | grep -q '^1$'; then
                echo "Database vmdb already exists."
              else
                echo "Database vmdb does not exist. Creating it..."
                psql -h "${DB_HOST}" -U "${DB_USER}" -d postgres -c "CREATE DATABASE vmdb;"
              fi
              echo "Creating table virtual_machines..."
              psql -h "${DB_HOST}" -U "${DB_USER}" -d vmdb <<'SQL'
              CREATE TABLE IF NOT EXISTS public.virtual_machines (
                  type TEXT,
                  id TEXT,
                  kind TEXT,
                  name TEXT,
                  namespace TEXT,
                  time TEXT,
                  instancetype TEXT,
                  cpucores TEXT,
                  cpusockets TEXT,
                  memory TEXT,
                  storageclass TEXT,
                  network TEXT
              );
              SQL
              echo "Database initialization completed."
